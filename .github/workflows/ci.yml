name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + APKs (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache + validación de wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          # Falla rápido y claro si falta o fue alterado el wrapper.
          validate-wrappers: true

      # El bit de ejecución se pierde al commitear desde Windows (NTFS no lo
      # conserva); esto garantiza que ./gradlew sea ejecutable en Linux.
      - name: Asegurar permisos de ejecución del wrapper
        run: chmod +x gradlew

      - name: Unit tests (parser, Money, finanzas, carrito)
        run: ./gradlew testBundledOcrDebugUnitTest --stacktrace

      - name: Assemble bundledOcr (debug + release)
        run: ./gradlew :app:assembleBundledOcrDebug :app:assembleBundledOcrRelease

      - name: Assemble thinOcr (debug)
        run: ./gradlew :app:assembleThinOcrDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: paylensu-apks
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 14
