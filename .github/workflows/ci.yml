name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + APKs (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (parser, Money, finanzas, carrito)
        run: ./gradlew testBundledOcrDebugUnitTest --stacktrace

      - name: Assemble bundledOcr (debug + release)
        run: ./gradlew :app:assembleBundledOcrDebug :app:assembleBundledOcrRelease

      - name: Assemble thinOcr (debug)
        run: ./gradlew :app:assembleThinOcrDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: paylensu-apks
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 14
